<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>아트 비행 · Art Flight — Gallery 2026</title>
<meta name="description" content="Gallery 2026 미니게임 — 종이비행기로 떨어지는 물감을 맞춰 나만의 캔버스를 완성하세요.">
<style>
  :root{
    --paper:#f7f3ec;
    --paper-2:#fffdf8;
    --ink:#1c1b19;
    --terra:#c06a45;
    --sage:#7c8f79;
    --gold:#c9a227;
    --line:rgba(28,27,25,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;max-width:100%;height:100%;overflow:hidden;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;
    user-select:none;
  }
  #wrap{display:flex;flex-direction:column;width:100%;height:100%;position:relative;}

  header{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:10px clamp(10px,3vw,24px);
    width:100%;
    flex-shrink:0;
  }
  .left-nav{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .back{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);
    padding-bottom:3px;transition:.2s;white-space:nowrap;
  }
  .back:hover{color:var(--terra);border-color:var(--terra);}
  /* 메인 포털(iframe) 안에서 열릴 때는 중복되는 자체 뒤로가기 숨김 */
  body.in-portal .back, body.in-portal .ghost { display: none !important; }

  .sound-btn{
    appearance:none;background:none;border:1px solid var(--line);border-radius:4px;
    font:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink);padding:5px 8px;cursor:pointer;transition:.2s;opacity:.8;white-space:nowrap;
  }
  .sound-btn:hover{opacity:1;border-color:var(--ink);}

  .brand{display:flex;align-items:baseline;gap:9px;min-width:0;}
  .brand h1{
    font-family:"Playfair Display",Didot,Georgia,"Nanum Myeongjo",serif;
    font-size:clamp(16px,2.4vw,23px);font-weight:400;margin:0;letter-spacing:.02em;white-space:nowrap;
  }
  .brand span{font-size:9px;letter-spacing:.26em;color:var(--terra);text-transform:uppercase;white-space:nowrap;}
  .hud{display:flex;gap:clamp(10px,2.4vw,20px);align-items:center;margin-left:auto;}
  .hud-item{display:flex;flex-direction:column;gap:1px;text-align:right;}
  .hud .k{font-size:8.5px;letter-spacing:.16em;opacity:.5;}
  .hud .v{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.03em;line-height:1.2;}
  .lives{color:var(--terra);letter-spacing:.08em;}
  .combo-v{color:var(--sage);font-weight:700;}

  main{flex:1;min-height:0;width:100%;padding:0 clamp(10px,3vw,24px) clamp(10px,3vw,24px);}
  #frame{
    position:relative;width:100%;height:100%;background:var(--paper-2);
    border:1px solid var(--line);border-radius:4px;overflow:hidden;
    box-shadow:0 18px 42px -30px rgba(28,27,25,.55);
  }
  canvas{display:block;width:100%;height:100%;touch-action:none;}

  /* 속담 문제판 */
  #quiz{
    position:absolute;left:8px;right:8px;top:8px;z-index:2;pointer-events:none;
    background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px 9px;text-align:center;box-shadow:0 8px 20px -14px rgba(0,0,0,.45);
    display:none;
  }
  #quiz.on{display:block;}
  #quiz .qn{font-size:10px;letter-spacing:.2em;color:var(--terra);font-weight:700;}
  #quiz .qt{font-size:clamp(15px,4.4vw,20px);font-weight:800;line-height:1.45;margin-top:2px;word-break:keep-all;}
  #quiz .blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--terra);color:transparent;margin:0 2px;}
  #quiz .ans{color:var(--terra);border-bottom:3px solid var(--terra);padding:0 2px;}
  #quiz .mean{font-size:12.5px;color:#5c5a55;margin-top:4px;line-height:1.45;word-break:keep-all;}
  #quiz .tbar{height:3px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden;}
  #quiz .tbar i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:left;}
  #quiz.hint .tbar i{background:#e8b923;}
  #quiz .htxt{font-size:11px;color:#b08b57;margin-top:3px;min-height:14px;}

  /* 정답! 화면 가득 속담 */
  #bigQ{
    position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px 18px;text-align:center;pointer-events:none;opacity:0;visibility:hidden;
    background:radial-gradient(ellipse at center, rgba(255,250,238,.97) 0%, rgba(250,240,220,.95) 70%, rgba(240,225,195,.93) 100%);
    transition:opacity .25s, visibility .25s;
  }
  #bigQ.on{opacity:1;visibility:visible;}
  #bigQ .ok{font-size:13px;letter-spacing:.3em;color:var(--terra);font-weight:800;}
  #bigQ .pv{font-size:clamp(26px,8.2vw,44px);font-weight:900;line-height:1.35;margin:10px 0 12px;word-break:keep-all;color:#2a2622;}
  #bigQ .pv b{color:var(--terra);background:linear-gradient(transparent 62%, rgba(212,168,83,.45) 62%);padding:0 4px;}
  #bigQ .mn{font-size:clamp(14px,4vw,18px);color:#5c5a55;line-height:1.5;max-width:30em;word-break:keep-all;}
  #bigQ.on .pv{animation:bigPop .5s cubic-bezier(.2,1.4,.4,1);}
  @keyframes bigPop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  @media (orientation:landscape) and (max-height:500px){ #bigQ .pv{font-size:clamp(22px,5vw,34px);margin:6px 0 8px;} }
  .learned{max-height:34vh;overflow-y:auto;text-align:left;font-size:12px;line-height:1.5;margin:0 0 14px;border-top:1px solid var(--line);padding-top:8px;}
  .learned div{padding:5px 0;border-bottom:1px dashed var(--line);word-break:keep-all;}
  .learned b{color:var(--terra);}
  .learned small{display:block;opacity:.7;}

  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:16px;background:rgba(247,243,236,.72);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .28s ease;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .card{
    max-width:390px;width:100%;background:var(--paper-2);border:1px solid var(--line);
    padding:clamp(18px,4vw,28px);text-align:center;border-radius:6px;
    box-shadow:0 22px 52px -32px rgba(0,0,0,.5);
  }
  .card .eyebrow{font-size:9px;letter-spacing:.26em;color:var(--terra);margin:0 0 8px;text-transform:uppercase;}
  .card h2{
    font-family:"Playfair Display",Didot,Georgia,"Nanum Myeongjo",serif;
    font-weight:400;font-size:clamp(22px,5vw,30px);margin:0 0 10px;letter-spacing:.01em;
  }
  .card .desc{font-size:12.5px;line-height:1.7;opacity:.78;margin:0 0 14px;word-break:keep-all;}
  .card .scoreline{display:flex;gap:20px;justify-content:center;margin:14px 0 18px;}
  .card .scoreline div{display:flex;flex-direction:column;gap:3px;}
  .card .scoreline .k{font-size:9px;letter-spacing:.18em;opacity:.5;text-transform:uppercase;}
  .card .scoreline .v{font-family:"Playfair Display",Didot,Georgia,serif;font-size:clamp(22px,6vw,30px);line-height:1;font-variant-numeric:tabular-nums;}
  .keys{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:6px;font-size:11.5px;opacity:.75;letter-spacing:.02em;word-break:keep-all;}
  .keys b{font-weight:600;color:var(--ink);}
  .btn{
    appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper-2);
    font:inherit;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    padding:13px 22px;cursor:pointer;transition:.18s;width:100%;border-radius:4px;
  }
  .btn:hover{background:var(--terra);border-color:var(--terra);}
  .btn:active{transform:translateY(1px);}
  .ghost{
    display:inline-block;margin-top:13px;font-size:11px;letter-spacing:.1em;
    color:var(--ink);opacity:.55;text-decoration:none;border-bottom:1px solid transparent;transition:.2s;
  }
  .ghost:hover{opacity:1;border-color:var(--ink);}
  @media (max-width:620px){
    .brand{display:none;}
  }
  /* 작은 휴대폰: 점수판이 잘리지 않게 */
  @media (max-width:380px){
    header{gap:6px;padding-left:10px;padding-right:10px;}
    .hud{gap:8px;}
    .hud-item:nth-child(3){display:none;}
    .sound-btn{padding:5px 7px;font-size:9px;letter-spacing:.06em;}
  }

  /* ===================== ✨ 2026 어워즈 스타일 (홀로그램 라벤더 + 네온 리본) ===================== */
  :root{ --navy:#1e2a4f; --hot:#ec4899; --lav:#c4b5fd; }
  body{background:linear-gradient(160deg,#efe4ff 0%,#fbe3f3 45%,#dcf7f5 100%);color:var(--navy);}
  header .back,.sound-btn{color:var(--navy);border-color:rgba(30,42,79,.18);}
  .brand h1{font-weight:700;letter-spacing:.04em;background:linear-gradient(90deg,#4338ca,#db2777);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand span{color:var(--hot);}
  .lives{color:var(--hot);} .combo-v{color:#7c3aed;}
  #frame{background:transparent;border:2px solid rgba(255,255,255,.85);border-radius:18px;box-shadow:0 0 0 1px rgba(196,181,253,.6),0 20px 50px -24px rgba(124,58,237,.55);}
  #quiz{background:rgba(255,255,255,.9);border:2px solid #f9a8d4;border-radius:16px;box-shadow:0 0 0 3px rgba(255,255,255,.6),0 10px 24px -14px rgba(219,39,119,.5);}
  #quiz .qn{color:var(--hot);} #quiz .blank,#quiz .ans{border-color:var(--hot);} #quiz .ans{color:var(--hot);}
  #quiz .tbar i{background:linear-gradient(90deg,#a78bfa,#f472b6);}
  #bigQ{background:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.97),rgba(243,232,255,.96) 55%,rgba(252,231,243,.95));}
  #bigQ .ok{color:var(--hot);} #bigQ .pv{color:var(--navy);} #bigQ .pv b{color:#7c3aed;background:linear-gradient(transparent 62%,rgba(244,114,182,.35) 62%);}
  .overlay{background:rgba(237,228,255,.55);}
  .card{border:2px solid #f5d0fe;border-radius:22px;background:rgba(255,255,255,.92);box-shadow:0 0 0 3px rgba(255,255,255,.7),0 24px 50px -28px rgba(124,58,237,.6);}
  .card .eyebrow{color:var(--hot);} .btn{background:linear-gradient(135deg,#7c3aed,#db2777);border:none;border-radius:99px;color:#fff;}
  .btn:hover{background:linear-gradient(135deg,#6d28d9,#be185d);}

  /* 시작 화면: 검은 무대 + 네온 리본 + 아치 라인 */
  .overlay.hero-on{padding:0;background:#05030a;-webkit-backdrop-filter:none;backdrop-filter:none;}
  .hero{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:18px;}
  .hero canvas{position:absolute;inset:0;width:100%;height:100%;}
  .hero .in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;}
  .hero .top{position:absolute;top:14px;left:0;right:0;text-align:center;z-index:2;font:800 12px/1 Arial,sans-serif;letter-spacing:.32em;color:rgba(255,255,255,.85);}
  .af-logo{position:relative;font-family:"Playfair Display",Didot,"Bodoni 72",Georgia,serif;font-weight:900;font-size:clamp(54px,17vw,104px);line-height:.9;letter-spacing:-.02em;
    background:linear-gradient(180deg,#fff 30%,#f5d0fe 70%,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(236,72,153,.45));}
  .af-logo .ring{position:absolute;left:-12%;right:-12%;top:46%;height:28%;border-radius:50%;border:3px solid rgba(255,255,255,.92);border-top-color:transparent;transform:rotate(-8deg);filter:drop-shadow(0 0 6px rgba(255,255,255,.8));pointer-events:none;}
  .af-logo .st{position:absolute;right:30%;top:22%;font-size:.28em;color:#fff;-webkit-text-fill-color:#fff;filter:drop-shadow(0 0 8px #fff);animation:afTw 1.8s ease-in-out infinite;}
  @keyframes afTw{50%{transform:scale(1.35) rotate(25deg);opacity:.7}}
  .af-sub{margin-top:14px;font:700 clamp(13px,3.6vw,18px)/1.2 Arial,"Apple SD Gothic Neo",sans-serif;letter-spacing:.18em;}
  .af-year{font:900 clamp(40px,12vw,70px)/1 Arial,"Apple SD Gothic Neo",sans-serif;letter-spacing:-.01em;margin-top:6px;background:linear-gradient(180deg,#fff,#e9d5ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .af-line{margin-top:18px;font:700 14px/1.4 "Apple SD Gothic Neo",sans-serif;color:#f5f3ff;}
  .af-line i{font-style:normal;opacity:.6;margin:0 8px;}
  .af-pill{margin-top:14px;appearance:none;border:1.5px solid rgba(255,255,255,.55);border-radius:99px;padding:14px 34px;font:800 clamp(17px,5vw,21px)/1 "Apple SD Gothic Neo",sans-serif;color:#fff;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 24px rgba(236,72,153,.5),0 10px 24px rgba(0,0,0,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
  .af-pill:active{transform:scale(.97);}
  .af-mini{display:flex;gap:8px;margin-top:12px;}
  .af-mini button{appearance:none;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#f5f3ff;border-radius:99px;padding:8px 14px;font:700 12.5px/1 "Apple SD Gothic Neo",sans-serif;cursor:pointer;}
  .af-how{display:none;margin-top:12px;max-width:340px;text-align:left;font-size:12.5px;line-height:1.6;background:rgba(10,5,20,.6);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 14px;color:#ede9fe;}
  .af-how.on{display:block;}
  .af-back{position:absolute;bottom:12px;left:0;right:0;z-index:2;text-align:center;}
  .af-back a{color:rgba(255,255,255,.6);font-size:12px;text-decoration:none;}
  body.in-portal .af-back{display:none;}

  /* 비행 기록 보드 (순위표) */
  .rank{position:absolute;inset:0;overflow-y:auto;padding:16px 12px 18px;color:var(--navy);
    background:radial-gradient(circle at 15% 10%,rgba(255,255,255,.9),transparent 40%),linear-gradient(160deg,#e9d5ff 0%,#fbcfe8 45%,#ddd6fe 75%,#ccfbf1 100%);}
  .rank::before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,rgba(255,255,255,0) 0 60px,rgba(255,255,255,.25) 60px 70px,rgba(255,255,255,0) 70px 140px);}
  .rank > *{position:relative;}
  .rk-k{text-align:center;font:800 13px/1 Arial,sans-serif;letter-spacing:.06em;}
  .rk-h{text-align:center;font:900 clamp(32px,10vw,52px)/1 "Arial Narrow",Arial,"Apple SD Gothic Neo",sans-serif;letter-spacing:-.02em;margin:6px 0 10px;}
  .rk-pill{display:table;margin:0 auto;background:#fff;border-radius:99px;padding:6px 14px;font:700 13px/1.2 Arial,"Apple SD Gothic Neo",sans-serif;box-shadow:0 2px 8px rgba(124,58,237,.15);}
  .rk-pill b{color:var(--hot);margin-right:6px;} .rk-pill i{font-style:normal;opacity:.35;margin-right:6px;}
  .rk-sub{text-align:center;font-size:12px;margin:8px 0 12px;opacity:.75;}
  .rk-pod{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:8px;align-items:end;}
  .rk-c{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 0 0 3px #f9a8d4,0 0 0 5px rgba(255,255,255,.9),0 10px 24px -10px rgba(219,39,119,.5);}
  .rk-c.r1{box-shadow:0 0 0 3px #f472b6,0 0 0 5px #fff,0 0 30px rgba(244,114,182,.6);}
  .rk-c .im{aspect-ratio:1/1.05;background:#f5f3ff center/cover no-repeat;position:relative;}
  .rk-c .im::after{content:'';position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(transparent,#fff);}
  .rk-c .tx{padding:2px 10px 10px;text-align:left;}
  .rk-c .n{font:900 26px/1 Arial,sans-serif;color:var(--hot);}
  .rk-c .sc{font:800 15px/1.2 Arial,"Apple SD Gothic Neo",sans-serif;margin-top:4px;}
  .rk-c .dt{font-size:11px;opacity:.6;}
  .rk-c.empty .im{background:linear-gradient(160deg,#f5f3ff,#fdf2f8);display:grid;place-items:center;font-size:30px;}
  .rk-list{display:grid;grid-template-columns:1fr 1fr;column-gap:14px;margin-top:14px;}
  .rk-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(30,42,79,.15);font:700 14px/1 Arial,"Apple SD Gothic Neo",sans-serif;}
  .rk-row .n{width:28px;font:900 20px/1 Arial,sans-serif;color:var(--hot);text-align:center;}
  .rk-row small{margin-left:auto;font-size:11px;opacity:.55;font-weight:600;}
  .rk-row.me,.rk-c.me{outline:3px solid #a78bfa;outline-offset:2px;border-radius:10px;}
  .rk-note{text-align:right;font-size:11px;opacity:.6;margin-top:8px;}
  .rk-foot{display:flex;gap:8px;margin-top:14px;}
  .rk-foot .btn{flex:1;}
  .rk-foot .btn.l{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 2px #e9d5ff;}
  .rk-logo{text-align:center;margin-top:14px;font:900 18px/1 "Playfair Display",Georgia,serif;letter-spacing:.12em;color:var(--navy);opacity:.85;}
  .rk-new{display:table;margin:0 auto 8px;background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;border-radius:99px;padding:5px 14px;font:800 13px/1.2 "Apple SD Gothic Neo",sans-serif;animation:afTw 1.6s ease-in-out infinite;}
  .af-nick{margin-top:14px;display:flex;align-items:center;gap:8px;width:min(80vw,300px);border:1.5px solid rgba(255,255,255,.45);border-radius:99px;padding:6px 8px 6px 14px;background:rgba(255,255,255,.08);box-shadow:0 0 18px rgba(167,139,250,.35);}
  .af-nick input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:#fff;font:700 16px/1.4 "Apple SD Gothic Neo",sans-serif;padding:6px 0;text-align:center;}
  .af-nick input::placeholder{color:rgba(255,255,255,.5);}
  .af-nick.bad{border-color:#f472b6;animation:afShake .35s;}
  @keyframes afShake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .rk-c .sc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rk-row{white-space:nowrap;overflow:hidden;}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="left-nav">
      <a class="back" href="../gallery2026/?open=play">← 갤러리로</a>
      <button class="sound-btn" id="soundToggle" type="button">SOUND ON</button>
    </div>
    <div class="brand">
      <h1>아트 비행</h1>
      <span>속담 편</span>
    </div>
    <div class="hud">
      <div class="hud-item"><span class="k">COMBO</span><span class="v combo-v" id="combo">0</span></div>
      <div class="hud-item"><span class="k">SCORE</span><span class="v" id="score">0</span></div>
      <div class="hud-item"><span class="k">BEST</span><span class="v" id="best">0</span></div>
      <div class="hud-item"><span class="k">LIFE</span><span class="v lives" id="lives">●●●</span></div>
    </div>
  </header>

  <main>
    <div id="frame">
      <canvas id="game"></canvas>
      <div id="bigQ"><div class="ok">✨ 정답 ✨</div><div class="pv" id="bigPv"></div><div class="mn" id="bigMn"></div></div>
      <div id="quiz"><div class="qn" id="qn"></div><div class="qt" id="qt"></div><div class="mean" id="qmean"></div><div class="tbar"><i id="qbar"></i></div><div class="htxt" id="qhint"></div></div>
      <div class="overlay" id="overlay"></div>
    </div>
  </main>
</div>

<script>
(function () {
  'use strict';

  /* 포털 iframe 내부 실행 감지 */
  try {
    if (window.self !== window.top) {
      document.body.classList.add('in-portal');
    }
  } catch (e) {
    document.body.classList.add('in-portal');
  }

  /* ---------- Sound Engine (Web Audio API) ---------- */
  var audioCtx = null;
  var soundEnabled = true;
  var elSoundBtn = document.getElementById('soundToggle');

  function initAudio() {
    if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {

  /* ---------- Spawning & Effects ---------- */
  function addSplatter(x, y, color, radius) {
    if (splatters.length > 85) splatters.shift();
    var blobs = [];
    var count = 3 + ((Math.random() * 4) | 0);
    for (var i = 0; i < count; i++) {
      var ang = rand(0, Math.PI * 2);
      var dist = rand(0, radius * 0.75);
      blobs.push({
        dx: Math.cos(ang) * dist,
        dy: Math.sin(ang) * dist,
        r: radius * rand(0.35, 0.95)
      });
    }
    splatters.push({
      x: x, y: y,
      color: color,
      blobs: blobs,
      alpha: 0.13
    });
  }

  function spawnItem(x, y) {
    var weights = [0.45, 0.35, 0.20];
    if (state.lives >= 3) weights = [0.55, 0.45, 0];

    var r = Math.random();
    var chosen = 'triple';
    if (r < weights[0]) chosen = 'triple';
    else if (r < weights[0] + weights[1]) chosen = 'shield';
    else chosen = 'heal';

    items.push({
      x: x, y: y,
      vy: 0.11,
      r: 12,
      type: chosen,
      phase: rand(0, Math.PI * 2)
    });
  }

  function hitWord(tgt) {

      state.combo++;
      if (state.combo > state.maxCombo) state.maxCombo = state.combo;
      state.correct++;
      var fast = Math.max(0, Math.round(50 - state.qTime / 140));
      var bonus = Math.min(100, (state.combo - 1) * 20);
      var pts = 100 + bonus + fast - (state.hinted ? 30 : 0);
      state.score += pts;
      sfx.powerup();
      addSplatter(tgt.x, tgt.y, GOLD, tgt.rx);
      burst(tgt.x, tgt.y, GOLD, 26, 1.3);
      burst(tgt.x, tgt.y, tgt.color, 14, 1);
      addFloater(tgt.x, tgt.y, '정답! +' + pts + (state.combo >= 2 ? ' (' + state.combo + ' 콤보)' : ''), TERRA);

  function makeBullet(x, y, vx) {
    return { x: x, y: y, vx: vx, vy: -0.95, r: 3 };
  }

  function shoot() {
    sfx.shoot();
    if (state.tripleTimer > 0) {
      bullets.push(makeBullet(player.x, player.y - 16, 0));
      bullets.push(makeBullet(player.x - 8, player.y - 11, -0.11));
      bullets.push(makeBullet(player.x + 8, player.y - 11, 0.11));
    } else {
      bullets.push(makeBullet(player.x, player.y - 16, 0));
    }
  }

  function burst(x, y, color, n, power) {
    for (var i = 0; i < n; i++) {
      var a = rand(0, Math.PI * 2);
      var sp = rand(0.04, 0.24) * (power || 1);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        r: rand(1.3, 3.8),
        life: 0, max: rand(320, 620),
        color: color
      });
    }
  }

  function addFloater(x, y, text, color) {
    floaters.push({ x: x, y: y, text: text, color: color, life: 0, max: 750 });
  }

  function damagePlayer() {
    if (state.invuln > 0 || state.mode !== 'playing') return;

    if (player.shield) {
      player.shield = false;
      state.invuln = 900;
      state.shake = 220;
      sfx.shieldBreak();
      burst(player.x, player.y, SAGE, 16, 1.2);
      addFloater(player.x, player.y - 20, 'SHIELD BLOCK', SAGE);
      return;
    }

    state.lives--;
    state.combo = 0;
    state.invuln = 1500;
    state.shake = 420;
    sfx.damage();
    burst(player.x, player.y, TERRA, 20, 1.4);
    updateHud();
    if (state.lives <= 0) gameOver();
  }

  /* ---------- Update ---------- */
  function update(dt) {
    state.elapsed += dt;
    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt);
    if (state.tripleTimer > 0) state.tripleTimer = Math.max(0, state.tripleTimer - dt);

    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      d.y += (d.s * dt) / H;
      if (d.y > 1.05) { d.y = -0.05; d.x = Math.random(); }
    }

    if (state.mode !== 'playing') {

      ctx.fillStyle = col;
      ctx.font = '600 13px Georgia, serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(icon, 0, 1);
      ctx.restore();
    }
  }

  function drawBullets() {
    var gold = state.tripleTimer > 0;
    ctx.save();
    for (var i = 0; i < bullets.length; i++) {
      var b = bullets[i], an = Math.atan2(b.vx, -b.vy);
      ctx.shadowColor = gold ? '#fbbf24' : '#c084fc'; ctx.shadowBlur = 10;
      var g = ctx.createLinearGradient(b.x, b.y - b.r * 2, b.x, b.y + b.r * 2);
      g.addColorStop(0, '#ffffff'); g.addColorStop(.5, gold ? '#fcd34d' : '#a78bfa'); g.addColorStop(1, gold ? '#f97316' : '#ec4899');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r * 0.8, b.r * 2, an, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.beginPath(); ctx.ellipse(b.x, b.y - b.r * .6, b.r * .3, b.r * .8, an, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, 1 - p.life / p.max);
      ctx.fillStyle = p.color;
      if (p.star) {
        var s2 = p.r * 2.2;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - s2); ctx.quadraticCurveTo(p.x, p.y, p.x + s2, p.y);
        ctx.quadraticCurveTo(p.x, p.y, p.x, p.y + s2); ctx.quadraticCurveTo(p.x, p.y, p.x - s2, p.y);
        ctx.quadraticCurveTo(p.x, p.y, p.x, p.y - s2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawFloaters() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 14px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    for (var i = 0; i < floaters.length; i++) {
      var f = floaters[i];
      ctx.globalAlpha = Math.max(0, 1 - f.life / f.max);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.save();
    if (state.shake > 0) {
      var m = Math.min(6, state.shake / 60);
      ctx.translate(rand(-m, m), rand(-m, m));
    }
    drawBackground();
    drawItems();
    drawEnemies();
    drawBullets();
    drawPlayer();
    drawParticles();
    drawFloaters();
    ctx.restore();
  }

  /* ---------- Loop ---------- */
  var last = 0;
  function loop(now) {
    var dt = last ? Math.min(40, now - last) : 16;
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  /* ---------- Input ---------- */
  function toLocalX(e) {
    var rect = canvas.getBoundingClientRect();
    return (e.clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener('pointerdown', function (e) {
    initAudio();
    if (state.mode !== 'playing') return;
    pointer.drag = true;
    pointer.x = toLocalX(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!pointer.drag) return;
    pointer.x = toLocalX(e);
    e.preventDefault();
  });
  function endDrag() { pointer.drag = false; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (e.target && e.target.tagName === 'INPUT') { if (k === 'Enter' && !e.isComposing) { e.preventDefault(); var sb = overlay.querySelector('[data-act="start"]'); if (sb) sb.click(); } return; }
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; e.preventDefault(); }
    else if (k === 'p' || k === 'P' || k === 'Escape') { togglePause(); }
    else if ((k === 'Enter' || k === ' ') && (state.mode === 'ready' || state.mode === 'gameover')) { e.preventDefault(); var sb2 = overlay.querySelector('[data-act="start"]'); if (sb2) sb2.click(); else startGame(); }
  });
  window.addEventListener('keyup', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  });

  overlay.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    if (act === 'start') {
      var ni = document.getElementById('afNick');
      if (ni) { var nv = cleanNick(ni.value); if (!nv) { ni.parentNode.classList.remove('bad'); void ni.offsetWidth; ni.parentNode.classList.add('bad'); ni.focus(); return; } try { localStorage.setItem(NICK_KEY, nv); } catch (e) {} }
      cancelAnimationFrame(heroRaf); overlay.classList.remove('hero-on'); startGame();
    }
    else if (act === 'rank') screenRank(false);
    else if (act === 'rankg') screenRank(true);
    else if (act === 'home') screenStart();
    else if (act === 'how') { var hw = document.getElementById('afHow'); if (hw) hw.classList.toggle('on'); }
    else if (act === 'resume') togglePause();
  });

  // 다른 앱으로 나가면 자동으로 잠시 멈춤
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state.mode === 'playing') togglePause();
  });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 80);
  });

  /* ---------- Init ---------- */
  resize();
  updateHud();
  screenStart();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
