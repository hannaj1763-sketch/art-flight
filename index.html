<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>아트 비행 · Art Flight — Gallery 2026</title>
<meta name="description" content="Gallery 2026 미니게임 — 종이비행기로 떨어지는 물감을 맞춰 나만의 캔버스를 완성하세요.">
<style>
  :root{
    --paper:#f7f3ec;
    --paper-2:#fffdf8;
    --ink:#1c1b19;
    --terra:#c06a45;
    --sage:#7c8f79;
    --gold:#c9a227;
    --line:rgba(28,27,25,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;max-width:100%;height:100%;overflow:hidden;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;
    user-select:none;
  }
  #wrap{display:flex;flex-direction:column;width:100%;height:100%;position:relative;}

  header{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:10px clamp(10px,3vw,24px);
    width:100%;
    flex-shrink:0;
  }
  .left-nav{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .back{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);
    padding-bottom:3px;transition:.2s;white-space:nowrap;
  }
  .back:hover{color:var(--terra);border-color:var(--terra);}
  /* 메인 포털(iframe) 안에서 열릴 때는 중복되는 자체 뒤로가기 숨김 */
  body.in-portal .back, body.in-portal .ghost { display: none !important; }

  .sound-btn{
    appearance:none;background:none;border:1px solid var(--line);border-radius:4px;
    font:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink);padding:5px 8px;cursor:pointer;transition:.2s;opacity:.8;white-space:nowrap;
  }
  .sound-btn:hover{opacity:1;border-color:var(--ink);}

  .brand{display:flex;align-items:baseline;gap:9px;min-width:0;}
  .brand h1{
    font-family:"Playfair Display",Didot,Georgia,"Nanum Myeongjo",serif;
    font-size:clamp(16px,2.4vw,23px);font-weight:400;margin:0;letter-spacing:.02em;white-space:nowrap;
  }
  .brand span{font-size:9px;letter-spacing:.26em;color:var(--terra);text-transform:uppercase;white-space:nowrap;}
  .hud{display:flex;gap:clamp(10px,2.4vw,20px);align-items:center;margin-left:auto;}
  .hud-item{display:flex;flex-direction:column;gap:1px;text-align:right;}
  .hud .k{font-size:8.5px;letter-spacing:.16em;opacity:.5;}
  .hud .v{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.03em;line-height:1.2;}
  .lives{color:var(--terra);letter-spacing:.08em;}
  .combo-v{color:var(--sage);font-weight:700;}

  main{flex:1;min-height:0;width:100%;padding:0 clamp(10px,3vw,24px) clamp(10px,3vw,24px);}
  #frame{
    position:relative;width:100%;height:100%;background:var(--paper-2);
    border:1px solid var(--line);border-radius:4px;overflow:hidden;
    box-shadow:0 18px 42px -30px rgba(28,27,25,.55);
  }
  canvas{display:block;width:100%;height:100%;touch-action:none;}

  /* 속담 문제판 */
  #quiz{
    position:absolute;left:8px;right:8px;top:8px;z-index:2;pointer-events:none;
    background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px 9px;text-align:center;box-shadow:0 8px 20px -14px rgba(0,0,0,.45);
    display:none;
  }
  #quiz.on{display:block;}
  #quiz .qn{font-size:10px;letter-spacing:.2em;color:var(--terra);font-weight:700;}
  #quiz .qt{font-size:clamp(15px,4.4vw,20px);font-weight:800;line-height:1.45;margin-top:2px;word-break:keep-all;}
  #quiz .blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--terra);color:transparent;margin:0 2px;}
  #quiz .ans{color:var(--terra);border-bottom:3px solid var(--terra);padding:0 2px;}
  #quiz .mean{font-size:12.5px;color:#5c5a55;margin-top:4px;line-height:1.45;word-break:keep-all;}
  #quiz .tbar{height:3px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden;}
  #quiz .tbar i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:left;}
  #quiz.hint .tbar i{background:#e8b923;}
  #quiz .htxt{font-size:11px;color:#b08b57;margin-top:3px;min-height:14px;}
  .learned{max-height:34vh;overflow-y:auto;text-align:left;font-size:12px;line-height:1.5;margin:0 0 14px;border-top:1px solid var(--line);padding-top:8px;}
  .learned div{padding:5px 0;border-bottom:1px dashed var(--line);word-break:keep-all;}
  .learned b{color:var(--terra);}
  .learned small{display:block;opacity:.7;}

  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:16px;background:rgba(247,243,236,.72);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .28s ease;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .card{
    max-width:390px;width:100%;background:var(--paper-2);border:1px solid var(--line);
    padding:clamp(18px,4vw,28px);text-align:center;border-radius:6px;
    box-shadow:0 22px 52px -32px rgba(0,0,0,.5);
  }
  .card .eyebrow{font-size:9px;letter-spacing:.26em;color:var(--terra);margin:0 0 8px;text-transform:uppercase;}
  .card h2{
    font-family:"Playfair Display",Didot,Georgia,"Nanum Myeongjo",serif;
    font-weight:400;font-size:clamp(22px,5vw,30px);margin:0 0 10px;letter-spacing:.01em;
  }
  .card .desc{font-size:12.5px;line-height:1.7;opacity:.78;margin:0 0 14px;word-break:keep-all;}
  .card .scoreline{display:flex;gap:20px;justify-content:center;margin:14px 0 18px;}
  .card .scoreline div{display:flex;flex-direction:column;gap:3px;}
  .card .scoreline .k{font-size:9px;letter-spacing:.18em;opacity:.5;text-transform:uppercase;}
  .card .scoreline .v{font-family:"Playfair Display",Didot,Georgia,serif;font-size:clamp(22px,6vw,30px);line-height:1;font-variant-numeric:tabular-nums;}
  .keys{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:6px;font-size:11.5px;opacity:.75;letter-spacing:.02em;word-break:keep-all;}
  .keys b{font-weight:600;color:var(--ink);}
  .btn{
    appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper-2);
    font:inherit;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    padding:13px 22px;cursor:pointer;transition:.18s;width:100%;border-radius:4px;
  }
  .btn:hover{background:var(--terra);border-color:var(--terra);}
  .btn:active{transform:translateY(1px);}
  .ghost{
    display:inline-block;margin-top:13px;font-size:11px;letter-spacing:.1em;
    color:var(--ink);opacity:.55;text-decoration:none;border-bottom:1px solid transparent;transition:.2s;
  }
  .ghost:hover{opacity:1;border-color:var(--ink);}
  @media (max-width:620px){
    .brand{display:none;}
  }
  /* 작은 휴대폰: 점수판이 잘리지 않게 */
  @media (max-width:380px){
    header{gap:6px;padding-left:10px;padding-right:10px;}
    .hud{gap:8px;}
    .hud-item:nth-child(3){display:none;}
    .sound-btn{padding:5px 7px;font-size:9px;letter-spacing:.06em;}
  }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="left-nav">
      <a class="back" href="../gallery2026/?open=play">← 갤러리로</a>
      <button class="sound-btn" id="soundToggle" type="button">SOUND ON</button>
    </div>
    <div class="brand">
      <h1>아트 비행</h1>
      <span>속담 편</span>
    </div>
    <div class="hud">
      <div class="hud-item"><span class="k">COMBO</span><span class="v combo-v" id="combo">0</span></div>
      <div class="hud-item"><span class="k">SCORE</span><span class="v" id="score">0</span></div>
      <div class="hud-item"><span class="k">BEST</span><span class="v" id="best">0</span></div>
      <div class="hud-item"><span class="k">LIFE</span><span class="v lives" id="lives">●●●</span></div>
    </div>
  </header>

  <main>
    <div id="frame">
      <canvas id="game"></canvas>
      <div id="quiz"><div class="qn" id="qn"></div><div class="qt" id="qt"></div><div class="mean" id="qmean"></div><div class="tbar"><i id="qbar"></i></div><div class="htxt" id="qhint"></div></div>
      <div class="overlay" id="overlay"></div>
    </div>
  </main>
</div>

<script>
(function () {
  'use strict';

  /* 포털 iframe 내부 실행 감지 */
  try {
    if (window.self !== window.top) {
      document.body.classList.add('in-portal');
    }
  } catch (e) {
    document.body.classList.add('in-portal');
  }

  /* ---------- Sound Engine (Web Audio API) ---------- */
  var audioCtx = null;
  var soundEnabled = true;
  var elSoundBtn = document.getElementById('soundToggle');

  function initAudio() {
    if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(freq, type, duration, vol, slideTo) {
    if (!soundEnabled || !audioCtx) return;
    try {
      var now = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, now);
      if (slideTo) {
        osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
      }
      gain.gain.setValueAtTime(vol || 0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration);
    } catch (e) {}
  }

  var sfx = {
    shoot: function () { playTone(520, 'triangle', 0.06, 0.025, 280); },
    hit: function () { playTone(260, 'sine', 0.08, 0.04, 180); },
    pop: function (combo) {
      var pitch = Math.min(880, 340 + (combo || 0) * 18);
      playTone(pitch, 'sine', 0.14, 0.055, pitch * 1.35);
    },
    powerup: function () {
      playTone(440, 'sine', 0.12, 0.06, 660);
      setTimeout(function () { playTone(660, 'sine', 0.18, 0.06, 880); }, 90);
    },
    damage: function () { playTone(150, 'sawtooth', 0.28, 0.07, 55); },
    shieldBreak: function () { playTone(380, 'triangle', 0.2, 0.06, 140); }
  };

  elSoundBtn.addEventListener('click', function () {
    initAudio();
    soundEnabled = !soundEnabled;
    elSoundBtn.textContent = soundEnabled ? 'SOUND ON' : 'SOUND OFF';
    elSoundBtn.style.opacity = soundEnabled ? '0.85' : '0.4';
  });

  /* ---------- 속담 문제 (빈칸 = 정답) ---------- */
  // [앞, 정답, 뒤, [오답 3개], 뜻]

    ['티끌 모아', '태산', '', ['바다', '구름', '모래'], '작은 것도 모으면 아주 커져요.'],

  /* ---------- Setup ---------- */

  var elLives = document.getElementById('lives');
  var elCombo = document.getElementById('combo');

  var KEY = 'artflight.best.v2';
  var INK = '#1c1b19';
  var TERRA = '#c06a45';
  var SAGE = '#7c8f79';
  var GOLD = '#c9a227';
  var PALETTE = ['#c06a45', '#7c8f79', '#4a6b8a', '#b08b57', '#8a5b7a'];

  var W = 360, H = 560, DPR = 1;
  var inited = false;

  var state = {
    mode: 'ready',      // ready | playing | paused | gameover

    qIndex: 0,          // 이번 판 몇 번째 문제

    correct: 0,
    hinted: false
  };
  var Q_PER_GAME = 10, HINT_MS = 7000, WAVE_MS = 3300;
  var quizSet = [], curQ = null, learned = [];
  var elQuiz = document.getElementById('quiz');
  var elQn = document.getElementById('qn');
  var elQt = document.getElementById('qt');
  var elQmean = document.getElementById('qmean');
  var elQbar = document.getElementById('qbar');
  var elQhint = document.getElementById('qhint');

  var player = { x: 180, y: 480, r: 13, vx: 0, shield: false, trail: [] };
  var bullets = [];
  var enemies = [];
  var items = [];
  var particles = [];
  var splatters = [];
  var floaters = [];
  var dots = [];
  var keys = { left: false, right: false };
  var pointer = { drag: false, x: 0 };

  function readBest() {
    try {
      var v = parseInt(window.localStorage.getItem(KEY), 10);
      return isNaN(v) ? 0 : v;
    } catch (e) { return 0; }
  }
  function writeBest(v) {
    try { window.localStorage.setItem(KEY, String(v)); } catch (e) {}
  }
  state.best = readBest();

  /* ---------- Helpers ---------- */
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  function initDots() {
    dots = [];
    for (var i = 0; i < 42; i++) {
      dots.push({
        x: Math.random(),
        y: Math.random(),
        r: rand(0.6, 2.2),
        s: rand(0.006, 0.025),
        a: rand(0.05, 0.15)
      });
    }
  }
  initDots();

  function resize() {
    var rect = frameEl.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(240, Math.round(rect.width));
    H = Math.max(280, Math.round(rect.height));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    player.y = H - 68;
    if (!inited) { player.x = W / 2; inited = true; }
    player.x = clamp(player.x, player.r + 12, W - player.r - 12);
  }

  /* ---------- HUD ---------- */
  function updateHud() {
    if (state.score > state.best) {
      state.best = state.score;
      writeBest(state.best);
    }
    elScore.textContent = state.score;
    elBest.textContent = state.best;
    elCombo.textContent = state.combo > 1 ? state.combo + 'x' : state.combo;
    var s = '';
    for (var i = 0; i < 3; i++) s += (i < state.lives ? '●' : '○');
    elLives.textContent = s;
  }

  /* ---------- Overlay Screens ---------- */
  function showOverlay(html) {
    overlay.innerHTML = html;
    overlay.classList.add('show');
  }
  function hideOverlay() {
    overlay.classList.remove('show');
    overlay.innerHTML = '';
  }

  function screenStart() {
    showOverlay(
      '<div class="card">' +
        '<p class="eyebrow">Gallery 2026 · 속담 편</p>' +
        '<h2>아트 비행 · 속담 부수기</h2>' +
        '<p class="desc">위에 나온 속담의 <b>빈칸</b>에 들어갈 말을 찾아<br>그 말이 적힌 물감 방울을 쏘세요!</p>' +
        '<ul class="keys">' +
          '<li><b>정답</b> 큰 점수 + 콤보 · <b>틀린 말</b> 콤보가 끊겨요</li>' +
          '<li>못 찾고 있으면 <b>정답 방울이 반짝반짝</b> 빛나요</li>' +
          '<li><b>화면 드래그</b> 또는 <b>← →</b>로 이동 · 방울에 부딪히면 ● 하나 잃어요</li>' +
        '</ul>' +
        '<button class="btn" data-act="start">시작하기 (속담 10문제)</button>' +
        '<a class="ghost" href="../gallery2026/?open=play">← 갤러리로 돌아가기</a>' +
      '</div>'
    );
  }

  function screenPause() {
    showOverlay(
      '<div class="card">' +
        '<p class="eyebrow">Paused</p>' +
        '<h2>잠시 멈춤</h2>' +
        '<p class="desc">작품을 감상하며 잠시 숨을 고르세요.</p>' +
        '<button class="btn" data-act="resume">계속하기</button>' +
        '<a class="ghost" href="../gallery2026/?open=play">← 갤러리로</a>' +
      '</div>'
    );
  }

  function screenGameOver() {
    var clear = state.qIndex >= Q_PER_GAME && state.lives > 0;
    var list = learned.map(function (q) {
      return '<div>' + q[0] + ' <b>' + q[1] + '</b> ' + q[2] + '<small>' + q[4] + '</small></div>';
    }).join('');
    showOverlay(
      '<div class="card" style="max-height:94%;overflow-y:auto">' +
        '<p class="eyebrow">' + (clear ? '속담 10문제 완료' : 'Game Over') + '</p>' +
        '<h2>' + (state.correct >= 9 ? '속담 박사! 🎓' : state.correct >= 6 ? '속담 척척! ✨' : '속담 새싹 🌱') + '</h2>' +
        '<div class="scoreline">' +
          '<div><span class="k">정답</span><span class="v">' + state.correct + '/' + Q_PER_GAME + '</span></div>' +
          '<div><span class="k">Score</span><span class="v">' + state.score + '</span></div>' +
          '<div><span class="k">Max Combo</span><span class="v">' + state.maxCombo + '</span></div>' +
        '</div>' +
        (list ? '<div class="learned">' + list + '</div>' : '') +
        '<button class="btn" data-act="start">새 속담으로 다시</button>' +
        '<a class="ghost" href="../gallery2026/?open=play">← 갤러리로 돌아가기</a>' +
      '</div>'
    );
  }

  /* ---------- Game Flow ---------- */
  function resetGame() {
    resize();
    state.score = 0;
    state.lives = 3;
    state.combo = 0;
    state.maxCombo = 0;
    state.spawnTimer = 650;
    state.fireTimer = 0;
    state.invuln = 0;
    state.shake = 0;
    state.elapsed = 0;
    state.tripleTimer = 0;
    state.qIndex = 0; state.correct = 0; state.reveal = 0;
    learned = [];
    var pool = PROVERBS.slice();
    for (var i = pool.length - 1; i > 0; i--) { var j = (Math.random() * (i + 1)) | 0; var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
    quizSet = pool.slice(0, Q_PER_GAME);

    bullets.length = 0;
    enemies.length = 0;
    items.length = 0;
    particles.length = 0;
    splatters.length = 0;
    floaters.length = 0;

    player.x = W / 2;
    player.vx = 0;
    player.shield = false;
    player.trail.length = 0;
    pointer.x = player.x;
    pointer.drag = false;
    updateHud();
  }

  function startGame() {
    initAudio();
    resetGame();
    state.mode = 'playing';
    hideOverlay();
    nextQuestion(true);
  }

  function togglePause() {
    if (state.mode === 'playing') {
      state.mode = 'paused';
      screenPause();
    } else if (state.mode === 'paused') {
      state.mode = 'playing';
      hideOverlay();
    }
  }

  function gameOver() {
    state.mode = 'gameover';
    elQuiz.classList.remove('on');
    pointer.drag = false;
    updateHud();
    screenGameOver();
  }

  /* ---------- Spawning & Effects ---------- */
  function addSplatter(x, y, color, radius) {
    if (splatters.length > 85) splatters.shift();
    var blobs = [];
    var count = 3 + ((Math.random() * 4) | 0);
    for (var i = 0; i < count; i++) {
      var ang = rand(0, Math.PI * 2);
      var dist = rand(0, radius * 0.75);
      blobs.push({
        dx: Math.cos(ang) * dist,
        dy: Math.sin(ang) * dist,
        r: radius * rand(0.35, 0.95)
      });
    }
    splatters.push({
      x: x, y: y,
      color: color,
      blobs: blobs,
      alpha: 0.13
    });
  }

  function spawnItem(x, y) {
    var weights = [0.45, 0.35, 0.20];
    if (state.lives >= 3) weights = [0.55, 0.45, 0];

    var r = Math.random();
    var chosen = 'triple';
    if (r < weights[0]) chosen = 'triple';
    else if (r < weights[0] + weights[1]) chosen = 'shield';
    else chosen = 'heal';

    items.push({
      x: x, y: y,
      vy: 0.11,
      r: 12,
      type: chosen,
      phase: rand(0, Math.PI * 2)
    });
  }

  /* ---------- 속담 문제 ---------- */
  function quizTop() { return elQuiz.classList.contains('on') ? elQuiz.offsetHeight + 12 : 10; }

  function renderQuiz(showAnswer) {
    var q = curQ;
    elQn.textContent = '속담 ' + (state.qIndex + 1) + ' / ' + Q_PER_GAME;
    elQt.innerHTML = q[0] + ' ' + (showAnswer ? '<span class="ans">' + q[1] + '</span>' : '<span class="blank">' + q[1] + '</span>') + (q[2] ? ' ' + q[2] : '');
    elQmean.textContent = showAnswer ? '뜻: ' + q[4] : '';
    elQhint.textContent = showAnswer ? '' : (state.hinted ? '✨ 반짝이는 방울을 찾아요!' : '');
    elQuiz.classList.toggle('hint', state.hinted && !showAnswer);
  }

  function nextQuestion(first) {
    if (!first) state.qIndex++;
    if (state.qIndex >= Q_PER_GAME) { finishQuiz(); return; }
    curQ = quizSet[state.qIndex];
    state.qTime = 0; state.hinted = false; state.reveal = 0;
    state.waveTimer = 400;
    elQuiz.classList.add('on');
    renderQuiz(false);
  }

  function finishQuiz() {
    state.mode = 'gameover';
    elQuiz.classList.remove('on');
    updateHud();
    var paint = state.correct >= 6 ? 1 : 0;
    if (paint) { try { localStorage.setItem('agjj_pending_paint', String((parseInt(localStorage.getItem('agjj_pending_paint') || '0', 10) || 0) + paint)); } catch (e) {} }
    screenGameOver();
  }

  function measureWord(t) {
    ctx.save();
    ctx.font = '800 15px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    var w = ctx.measureText(t).width;
    ctx.restore();
    return w;
  }

  // 한 번에 3개(정답 1 + 오답 2) 방울을 떨어뜨려요
  function spawnWave() {
    var q = curQ;
    var wrong = q[3].slice().sort(function () { return Math.random() - 0.5; }).slice(0, W < 340 ? 1 : 2);
    var words = [{ t: q[1], ok: true }].concat(wrong.map(function (t) { return { t: t, ok: false }; }));
    words.sort(function () { return Math.random() - 0.5; });
    var n = words.length, colW = (W - 16) / n;
    var top = quizTop();
    var diff = Math.min(state.qIndex / Q_PER_GAME, 1);
    for (var i = 0; i < n; i++) {
      var tw = measureWord(words[i].t);
      var rx = Math.min(colW / 2 - 4, tw / 2 + 14), ry = 19;
      var cx = 8 + colW * i + colW / 2;
      enemies.push({
        type: 'word', text: words[i].t, ok: words[i].ok,
        x: cx, y: top - ry - rand(0, 60), r: ry, rx: rx, ry: ry,
        hp: 1, maxhp: 1, pts: 100,
        color: PALETTE[(Math.random() * PALETTE.length) | 0],
        vy: rand(0.042, 0.056) + diff * 0.02,
        baseX: cx, amp: Math.max(0, Math.min(14, colW / 2 - rx - 4)),
        phase: rand(0, Math.PI * 2), spd: rand(0.0008, 0.0016),
        rot: 0, spin: 0, flash: 0, sparkle: 0
      });
    }
  }

  function hitWord(tgt) {
    if (tgt.ok) {
      state.combo++;
      if (state.combo > state.maxCombo) state.maxCombo = state.combo;
      state.correct++;
      var fast = Math.max(0, Math.round(50 - state.qTime / 140));
      var bonus = Math.min(100, (state.combo - 1) * 20);
      var pts = 100 + bonus + fast - (state.hinted ? 30 : 0);
      state.score += pts;
      sfx.powerup();
      addSplatter(tgt.x, tgt.y, GOLD, tgt.rx);
      burst(tgt.x, tgt.y, GOLD, 26, 1.3);
      burst(tgt.x, tgt.y, tgt.color, 14, 1);
      addFloater(tgt.x, tgt.y, '정답! +' + pts + (state.combo >= 2 ? ' (' + state.combo + ' 콤보)' : ''), TERRA);
      state.shake = Math.max(state.shake, 160);
      if (state.combo % 3 === 0) spawnItem(tgt.x, tgt.y);
      learned.push(curQ);
      // 나머지 방울은 팡팡 터뜨리고 정답 문장 보여주기
      for (var k = enemies.length - 1; k >= 0; k--) {
        if (enemies[k] !== tgt) burst(enemies[k].x, enemies[k].y, enemies[k].color, 8, 0.8);
      }
      enemies.length = 0;
      bullets.length = 0;
      state.reveal = 2600;
      renderQuiz(true);
    } else {
      var lost = state.combo;
      state.combo = 0;
      sfx.damage();
      addSplatter(tgt.x, tgt.y, '#9a948a', tgt.rx * 0.8);
      burst(tgt.x, tgt.y, '#9a948a', 10, 0.9);
      addFloater(tgt.x, tgt.y, '땡! ✗' + (lost >= 2 ? ' 콤보 끊김' : ''), '#7a756d');
    }
    updateHud();
  }

  function makeBullet(x, y, vx) {
    return { x: x, y: y, vx: vx, vy: -0.95, r: 3 };
  }

  function shoot() {
    sfx.shoot();
    if (state.tripleTimer > 0) {
      bullets.push(makeBullet(player.x, player.y - 16, 0));
      bullets.push(makeBullet(player.x - 8, player.y - 11, -0.11));
      bullets.push(makeBullet(player.x + 8, player.y - 11, 0.11));
    } else {
      bullets.push(makeBullet(player.x, player.y - 16, 0));
    }
  }

  function burst(x, y, color, n, power) {
    for (var i = 0; i < n; i++) {
      var a = rand(0, Math.PI * 2);
      var sp = rand(0.04, 0.24) * (power || 1);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        r: rand(1.3, 3.8),
        life: 0, max: rand(320, 620),
        color: color
      });
    }
  }

  function addFloater(x, y, text, color) {
    floaters.push({ x: x, y: y, text: text, color: color, life: 0, max: 750 });
  }

  function damagePlayer() {
    if (state.invuln > 0 || state.mode !== 'playing') return;

    if (player.shield) {
      player.shield = false;
      state.invuln = 900;
      state.shake = 220;
      sfx.shieldBreak();
      burst(player.x, player.y, SAGE, 16, 1.2);
      addFloater(player.x, player.y - 20, 'SHIELD BLOCK', SAGE);
      return;
    }

    state.lives--;
    state.combo = 0;
    state.invuln = 1500;
    state.shake = 420;
    sfx.damage();
    burst(player.x, player.y, TERRA, 20, 1.4);
    updateHud();
    if (state.lives <= 0) gameOver();
  }

  /* ---------- Update ---------- */
  function update(dt) {
    state.elapsed += dt;
    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt);
    if (state.tripleTimer > 0) state.tripleTimer = Math.max(0, state.tripleTimer - dt);

    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      d.y += (d.s * dt) / H;
      if (d.y > 1.05) { d.y = -0.05; d.x = Math.random(); }
    }

    if (state.mode !== 'playing') {
      player.vx *= 0.88;
      return;
    }

    if (state.invuln > 0) state.invuln = Math.max(0, state.invuln - dt);

    var dir = 0;
    if (keys.left) dir -= 1;
    if (keys.right) dir += 1;

    if (dir !== 0) {
      player.vx = dir * 0.58;
      player.x += player.vx * dt;
      pointer.x = player.x;
    } else if (pointer.drag) {
      var dx = pointer.x - player.x;
      player.x += dx * Math.min(1, dt * 0.024);
      player.vx = clamp(dx * 0.02, -0.72, 0.72);
    } else {
      player.x += player.vx * dt;
      player.vx *= 0.82;
    }
    player.x = clamp(player.x, player.r + 12, W - player.r - 12);

    player.trail.push({ x: player.x, y: player.y + 10 });
    if (player.trail.length > 14) player.trail.shift();

    // 정답을 보여주는 동안은 잠깐 쉬어요
    if (state.reveal > 0) {
      state.reveal -= dt;
      if (state.reveal <= 0) nextQuestion(false);
      if (state.mode !== 'playing') return;
    } else {
      state.qTime += dt;
      elQbar.style.transform = 'scaleX(' + Math.max(0, 1 - state.qTime / HINT_MS) + ')';
      if (!state.hinted && state.qTime >= HINT_MS) { state.hinted = true; renderQuiz(false); sfx.powerup(); }

      state.fireTimer -= dt;
      if (state.fireTimer <= 0) {
        shoot();
        state.fireTimer = 260;
      }

      state.waveTimer -= dt;
      var onScreen = 0;
      for (var oc = 0; oc < enemies.length; oc++) if (enemies[oc].ok) onScreen++;
      if (state.waveTimer <= 0 && onScreen < 2) {
        spawnWave();
        state.waveTimer = WAVE_MS * rand(0.9, 1.15);
      }
    }

    for (var b = bullets.length - 1; b >= 0; b--) {
      var bl = bullets[b];
      bl.x += bl.vx * dt;
      bl.y += bl.vy * dt;
      if (bl.y < -24 || bl.x < -24 || bl.x > W + 24) bullets.splice(b, 1);
    }

    for (var it = items.length - 1; it >= 0; it--) {
      var item = items[it];
      item.y += item.vy * dt;
      item.x += Math.sin(state.elapsed * 0.004 + item.phase) * 0.04 * dt;

      var ix = item.x - player.x;
      var iy = item.y - player.y;
      if (ix * ix + iy * iy < (item.r + player.r + 4) * (item.r + player.r + 4)) {
        sfx.powerup();
        if (item.type === 'triple') {
          state.tripleTimer = 7500;
          addFloater(item.x, item.y, 'TRIPLE SHOT!', TERRA);
        } else if (item.type === 'shield') {
          player.shield = true;
          addFloater(item.x, item.y, 'SHIELD ON', SAGE);
        } else if (item.type === 'heal') {
          state.lives = Math.min(3, state.lives + 1);
          addFloater(item.x, item.y, 'LIFE +1', TERRA);
          updateHud();
        }
        burst(item.x, item.y, GOLD, 14, 1);
        items.splice(it, 1);
        continue;
      }
      if (item.y - item.r > H + 20) items.splice(it, 1);
    }

    for (var e = enemies.length - 1; e >= 0; e--) {
      var en = enemies[e];
      en.y += en.vy * dt;
      en.x = clamp(en.baseX + Math.sin(state.elapsed * en.spd + en.phase) * en.amp, en.r + 6, W - en.r - 6);
      en.rot += en.spin * dt;
      if (en.flash > 0) en.flash -= dt;
      if (state.hinted && en.ok) {
        en.sparkle += dt;
        if (Math.random() < dt * 0.012) {
          var sa = rand(0, Math.PI * 2);
          particles.push({ x: en.x + Math.cos(sa) * en.rx, y: en.y + Math.sin(sa) * en.ry, vx: Math.cos(sa) * 0.03, vy: -0.03, r: rand(1.4, 2.8), life: 0, max: 520, color: Math.random() < 0.5 ? GOLD : '#ffe9a0', star: true });
        }
      }

      if (en.y - en.r > H + 20) enemies.splice(e, 1);
    }

    for (var bi = bullets.length - 1; bi >= 0; bi--) {
      var bullet = bullets[bi];
      var hit = false;
      for (var ei = enemies.length - 1; ei >= 0; ei--) {
        var tgt = enemies[ei];
        var ex = (bullet.x - tgt.x) / (tgt.rx + bullet.r);
        var ey = (bullet.y - tgt.y) / (tgt.ry + bullet.r);
        if (ex * ex + ey * ey < 1) {
          hit = true;
          enemies.splice(ei, 1);
          hitWord(tgt);
          break;
        }
      }
      if (hit) bullets.splice(bi, 1);
      if (state.reveal > 0) break;
    }

    for (var ci = enemies.length - 1; ci >= 0; ci--) {
      var ce = enemies[ci];
      var px = (ce.x - player.x) / (ce.rx + player.r * 0.7);
      var py = (ce.y - player.y) / (ce.ry + player.r * 0.7);
      if (px * px + py * py < 1) {
        burst(ce.x, ce.y, ce.color, 14, 1.1);
        addSplatter(ce.x, ce.y, ce.color, ce.r);
        enemies.splice(ci, 1);
        damagePlayer();
        break;
      }
    }

    for (var pi = particles.length - 1; pi >= 0; pi--) {
      var p = particles[pi];
      p.life += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.vy += 0.00012 * dt;
      if (p.life >= p.max) particles.splice(pi, 1);
    }

    for (var fi = floaters.length - 1; fi >= 0; fi--) {
      var f = floaters[fi];
      f.life += dt;
      f.y -= 0.03 * dt;
      if (f.life >= f.max) floaters.splice(fi, 1);
    }
  }

  /* ---------- Draw ---------- */
  function drawBackground() {
    ctx.fillStyle = '#fffdf8';
    ctx.fillRect(0, 0, W, H);

    for (var s = 0; s < splatters.length; s++) {
      var sp = splatters[s];
      ctx.save();
      ctx.globalAlpha = sp.alpha;
      ctx.fillStyle = sp.color;
      for (var b = 0; b < sp.blobs.length; b++) {
        var bl = sp.blobs[b];
        ctx.beginPath();
        ctx.arc(sp.x + bl.dx, sp.y + bl.dy, bl.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    ctx.strokeStyle = 'rgba(28,27,25,0.035)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    var gap = 46;
    for (var x = gap; x < W; x += gap) {
      ctx.moveTo(Math.round(x) + 0.5, 0);
      ctx.lineTo(Math.round(x) + 0.5, H);
    }
    for (var y = gap; y < H; y += gap) {
      ctx.moveTo(0, Math.round(y) + 0.5);
      ctx.lineTo(W, Math.round(y) + 0.5);
    }
    ctx.stroke();

    var g = ctx.createRadialGradient(W / 2, H * 0.12, 10, W / 2, H * 0.12, Math.max(W, H) * 0.95);
    g.addColorStop(0, 'rgba(255,255,255,0.75)');
    g.addColorStop(0.55, 'rgba(247,243,236,0.12)');
    g.addColorStop(1, 'rgba(28,27,25,0.05)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      ctx.beginPath();
      ctx.arc(d.x * W, d.y * H, d.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(28,27,25,' + d.a + ')';
      ctx.fill();
    }
  }

  function drawPlayer() {
    if (state.lives <= 0) return;

    if (player.trail.length > 1) {
      ctx.save();
      for (var t = 1; t < player.trail.length; t++) {
        var p0 = player.trail[t - 1];
        var p1 = player.trail[t];
        var ratio = t / player.trail.length;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y + (player.trail.length - t) * 1.4);
        ctx.lineTo(p1.x, p1.y + (player.trail.length - t - 1) * 1.4);
        ctx.strokeStyle = 'rgba(28,27,25,' + (ratio * 0.18) + ')';
        ctx.lineWidth = 1 + ratio * 4;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
      ctx.restore();
    }

    // 무적 시간에는 깜빡여요
    if (state.invuln > 0 && Math.floor(state.invuln / 90) % 2 === 0) return;

    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(clamp(player.vx * 0.5, -0.35, 0.35));
    // 붓 모양 비행체
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(0, -player.r - 6);
    ctx.quadraticCurveTo(player.r, -2, player.r * 0.9, player.r);
    ctx.lineTo(-player.r * 0.9, player.r);
    ctx.quadraticCurveTo(-player.r, -2, 0, -player.r - 6);
    ctx.fill();
    ctx.fillStyle = state.tripleTimer > 0 ? TERRA : '#b08b57';
    ctx.fillRect(-player.r * 0.55, player.r - 1, player.r * 1.1, 7);
    ctx.fillStyle = '#fffdf8';
    ctx.beginPath(); ctx.arc(0, -2, 3.2, 0, Math.PI * 2); ctx.fill();
    if (player.shield) {
      ctx.strokeStyle = SAGE; ctx.lineWidth = 2;
      ctx.globalAlpha = 0.6 + Math.sin(state.elapsed * 0.01) * 0.25;
      ctx.beginPath(); ctx.arc(0, 0, player.r + 10, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawEnemies() {
    for (var i = 0; i < enemies.length; i++) {
      var en = enemies[i];
      var glow = state.hinted && en.ok;
      ctx.save();
      ctx.translate(en.x, en.y);
      if (glow) {
        var pulse = 0.5 + 0.5 * Math.sin(state.elapsed * 0.012);
        ctx.shadowColor = '#ffd23f';
        ctx.shadowBlur = 14 + pulse * 18;
        ctx.strokeStyle = 'rgba(255, 210, 63,' + (0.55 + pulse * 0.45) + ')';
        ctx.lineWidth = 4;
        roundRectPath(-en.rx - 5, -en.ry - 5, en.rx * 2 + 10, en.ry * 2 + 10, en.ry + 5);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
      // 물감 방울 모양 (울퉁불퉁 테두리)
      ctx.fillStyle = glow ? GOLD : en.color;
      roundRectPath(-en.rx, -en.ry, en.rx * 2, en.ry * 2, en.ry);
      ctx.fill();
      for (var k = 0; k < 3; k++) {
        var dx = (-0.6 + k * 0.6) * en.rx;
        ctx.beginPath();
        ctx.arc(dx, en.ry - 1, 3 + Math.sin(state.elapsed * 0.004 + k + en.phase) * 1.2 + 2, 0, Math.PI);
        ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath(); ctx.ellipse(-en.rx * 0.55, -en.ry * 0.45, en.ry * 0.38, en.ry * 0.2, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fffdf8';
      ctx.font = '800 15px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 3;
      ctx.fillText(en.text, 0, 1);
      ctx.restore();
    }
  }

  function drawItems() {
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var icon = it.type === 'triple' ? '✦' : it.type === 'shield' ? '◎' : '♥';
      var col = it.type === 'triple' ? TERRA : it.type === 'shield' ? SAGE : '#c0455e';
      ctx.save();
      ctx.translate(it.x, it.y);
      ctx.fillStyle = '#fffdf8';
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, it.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = col;
      ctx.font = '600 13px Georgia, serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(icon, 0, 1);
      ctx.restore();
    }
  }

  function drawBullets() {
    ctx.fillStyle = state.tripleTimer > 0 ? TERRA : INK;
    for (var i = 0; i < bullets.length; i++) {
      var b = bullets[i];
      ctx.beginPath();
      ctx.ellipse(b.x, b.y, b.r * 0.8, b.r * 2, Math.atan2(b.vx, -b.vy), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, 1 - p.life / p.max);
      ctx.fillStyle = p.color;
      if (p.star) {
        var s2 = p.r * 2.2;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - s2); ctx.quadraticCurveTo(p.x, p.y, p.x + s2, p.y);
        ctx.quadraticCurveTo(p.x, p.y, p.x, p.y + s2); ctx.quadraticCurveTo(p.x, p.y, p.x - s2, p.y);
        ctx.quadraticCurveTo(p.x, p.y, p.x, p.y - s2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawFloaters() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 14px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    for (var i = 0; i < floaters.length; i++) {
      var f = floaters[i];
      ctx.globalAlpha = Math.max(0, 1 - f.life / f.max);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.save();
    if (state.shake > 0) {
      var m = Math.min(6, state.shake / 60);
      ctx.translate(rand(-m, m), rand(-m, m));
    }
    drawBackground();
    drawItems();
    drawEnemies();
    drawBullets();
    drawPlayer();
    drawParticles();
    drawFloaters();
    ctx.restore();
  }

  /* ---------- Loop ---------- */
  var last = 0;
  function loop(now) {
    var dt = last ? Math.min(40, now - last) : 16;
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  /* ---------- Input ---------- */
  function toLocalX(e) {
    var rect = canvas.getBoundingClientRect();
    return (e.clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener('pointerdown', function (e) {
    initAudio();
    if (state.mode !== 'playing') return;
    pointer.drag = true;
    pointer.x = toLocalX(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!pointer.drag) return;
    pointer.x = toLocalX(e);
    e.preventDefault();
  });
  function endDrag() { pointer.drag = false; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; e.preventDefault(); }
    else if (k === 'p' || k === 'P' || k === 'Escape') { togglePause(); }
    else if ((k === 'Enter' || k === ' ') && (state.mode === 'ready' || state.mode === 'gameover')) { e.preventDefault(); startGame(); }
  });
  window.addEventListener('keyup', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  });

  overlay.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    if (act === 'start') startGame();
    else if (act === 'resume') togglePause();
  });

  // 다른 앱으로 나가면 자동으로 잠시 멈춤
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state.mode === 'playing') togglePause();
  });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 80);
  });

  /* ---------- Init ---------- */
  resize();
  updateHud();
  screenStart();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
