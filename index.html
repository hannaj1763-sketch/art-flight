<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>아트 비행 · Art Flight — Gallery 2026</title>
<meta name="description" content="Gallery 2026 미니게임 — 종이비행기로 떨어지는 물감을 맞춰 나만의 캔버스를 완성하세요.">
<style>
  :root{
    --paper:#f7f3ec;
    --paper-2:#fffdf8;
    --ink:#1c1b19;
    --terra:#c06a45;
    --sage:#7c8f79;
    --gold:#c9a227;
    --line:rgba(28,27,25,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;
    overflow:hidden;
    user-select:none;
  }
  #wrap{display:flex;flex-direction:column;height:100vh;height:100dvh;}

  header{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px clamp(12px,3vw,26px) 12px;
    flex-wrap:wrap;
  }
  .left-nav{display:flex;align-items:center;gap:14px;}
  .back{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);
    padding-bottom:3px;transition:.2s;white-space:nowrap;
  }
  .back:hover{color:var(--terra);border-color:var(--terra);}
  .sound-btn{
    appearance:none;background:none;border:1px solid var(--line);border-radius:2px;
    font:inherit;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink);padding:4px 8px;cursor:pointer;transition:.2s;opacity:.75;
  }
  .sound-btn:hover{opacity:1;border-color:var(--ink);}

  .brand{display:flex;align-items:baseline;gap:9px;min-width:0;}
  .brand h1{
    font-family:"Playfair Display",Didot,Georgia,"Nanum Myeongjo",serif;
    font-size:clamp(16px,2.4vw,23px);font-weight:400;margin:0;letter-spacing:.02em;white-space:nowrap;
  }
  .brand span{font-size:9px;letter-spacing:.26em;color:var(--terra);text-transform:uppercase;white-space:nowrap;}
  .hud{display:flex;gap:clamp(11px,2.4vw,22px);align-items:center;}
  .hud-item{display:flex;flex-direction:column;gap:1px;}
  .hud .k{font-size:9px;letter-spacing:.2em;opacity:.48;}
  .hud .v{font-size:14px;font-variant-numeric:tabular-nums;letter-spacing:.05em;line-height:1.2;}
  .lives{color:var(--terra);letter-spacing:.1em;}
  .combo-v{color:var(--sage);font-weight:600;}

  main{flex:1;min-height:0;padding:0 clamp(12px,3vw,26px) clamp(12px,3vw,26px);}
  #frame{
    position:relative;height:100%;background:var(--paper-2);
    border:1px solid var(--line);border-radius:2px;overflow:hidden;
    box-shadow:0 18px 42px -30px rgba(28,27,25,.55);
  }
  canvas{display:block;width:100%;height:100%;touch-action:none;}

  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:18px;background:rgba(247,243,236,.62);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .28s ease;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .card{
    max-width:410px;width:100%;background:var(--paper-2);border:1px solid var(--line);
    padding:clamp(20px,4vw,32px);text-align:center;
    box-shadow:0 22px 52px -32px rgba(0,0,0,.5);
  }
  .card .eyebrow{font-size:9px;letter-spacing:.28em;color:var(--terra);margin:0 0 11px;text-transform:uppercase;}
  .card h2{
    font-family:"Playfair Display",Didot,Georgia,"Nanum Myeongjo",serif;
    font-weight:400;font-size:clamp(23px,5vw,32px);margin:0 0 10px;letter-spacing:.01em;
  }
  .card .desc{font-size:12.5px;line-height:1.75;opacity:.75;margin:0 0 16px;}
  .card .scoreline{display:flex;gap:26px;justify-content:center;margin:16px 0 20px;}
  .card .scoreline div{display:flex;flex-direction:column;gap:3px;}
  .card .scoreline .k{font-size:9px;letter-spacing:.2em;opacity:.48;text-transform:uppercase;}
  .card .scoreline .v{font-family:"Playfair Display",Didot,Georgia,serif;font-size:clamp(24px,6vw,32px);line-height:1;font-variant-numeric:tabular-nums;}
  .keys{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:6px;font-size:11.5px;opacity:.72;letter-spacing:.02em;}
  .keys b{font-weight:600;color:var(--ink);}
  .btn{
    appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper-2);
    font:inherit;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;
    padding:13px 26px;cursor:pointer;transition:.18s;width:100%;
  }
  .btn:hover{background:var(--terra);border-color:var(--terra);}
  .btn:active{transform:translateY(1px);}
  .ghost{
    display:inline-block;margin-top:13px;font-size:11px;letter-spacing:.1em;
    color:var(--ink);opacity:.55;text-decoration:none;border-bottom:1px solid transparent;transition:.2s;
  }
  .ghost:hover{opacity:1;border-color:var(--ink);}
  @media (max-width:620px){
    header{padding:11px 12px 9px;}
    .hud{gap:10px;}
    .hud .k{font-size:8px;letter-spacing:.12em;}
    .hud .v{font-size:12.5px;}
    .brand{display:none;}
    main{padding:0 10px 10px;}
  }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="left-nav">
      <a class="back" href="../">← 갤러리로</a>
      <button class="sound-btn" id="soundToggle" type="button">SOUND ON</button>
    </div>
    <div class="brand">
      <h1>아트 비행</h1>
      <span>Art Flight</span>
    </div>
    <div class="hud">
      <div class="hud-item"><span class="k">COMBO</span><span class="v combo-v" id="combo">0</span></div>
      <div class="hud-item"><span class="k">SCORE</span><span class="v" id="score">0</span></div>
      <div class="hud-item"><span class="k">BEST</span><span class="v" id="best">0</span></div>
      <div class="hud-item"><span class="k">LIFE</span><span class="v lives" id="lives">●●●</span></div>
    </div>
  </header>

  <main>
    <div id="frame">
      <canvas id="game"></canvas>
      <div class="overlay" id="overlay"></div>
    </div>
  </main>
</div>

<script>
(function () {
  'use strict';

  /* ---------- Sound Engine (Web Audio API) ---------- */
  var audioCtx = null;
  var soundEnabled = true;
  var elSoundBtn = document.getElementById('soundToggle');

  function initAudio() {
    if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(freq, type, duration, vol, slideTo) {
    if (!soundEnabled || !audioCtx) return;
    try {
      var now = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, now);
      if (slideTo) {
        osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
      }
      gain.gain.setValueAtTime(vol || 0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration);
    } catch (e) {}
  }

  var sfx = {
    shoot: function () { playTone(520, 'triangle', 0.06, 0.025, 280); },
    hit: function () { playTone(260, 'sine', 0.08, 0.04, 180); },
    pop: function (combo) {
      var pitch = Math.min(880, 340 + (combo || 0) * 18);
      playTone(pitch, 'sine', 0.14, 0.055, pitch * 1.35);
    },
    powerup: function () {
      playTone(440, 'sine', 0.12, 0.06, 660);
      setTimeout(function () { playTone(660, 'sine', 0.18, 0.06, 880); }, 90);
    },
    damage: function () { playTone(150, 'sawtooth', 0.28, 0.07, 55); },
    shieldBreak: function () { playTone(380, 'triangle', 0.2, 0.06, 140); }
  };

  elSoundBtn.addEventListener('click', function () {
    initAudio();
    soundEnabled = !soundEnabled;
    elSoundBtn.textContent = soundEnabled ? 'SOUND ON' : 'SOUND OFF';
    elSoundBtn.style.opacity = soundEnabled ? '0.85' : '0.4';
  });

  /* ---------- Setup ---------- */
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var elScore = document.getElementById('score');
  var elBest = document.getElementById('best');
  var elLives = document.getElementById('lives');
  var elCombo = document.getElementById('combo');

  var KEY = 'artflight.best.v2';
  var INK = '#1c1b19';
  var TERRA = '#c06a45';
  var SAGE = '#7c8f79';
  var GOLD = '#c9a227';
  var PALETTE = ['#c06a45', '#7c8f79', '#4a6b8a', '#b08b57', '#8a5b7a'];

  var W = 800, H = 600, DPR = 1;
  var inited = false;

  var state = {
    mode: 'ready',      // ready | playing | paused | gameover
    score: 0,
    best: 0,
    lives: 3,
    combo: 0,
    maxCombo: 0,
    spawnTimer: 700,
    fireTimer: 0,
    invuln: 0,
    shake: 0,
    elapsed: 0,
    tripleTimer: 0
  };

  var player = { x: 400, y: 520, r: 13, vx: 0, shield: false, trail: [] };
  var bullets = [];
  var enemies = [];
  var items = [];
  var particles = [];
  var splatters = []; // 캔버스 배경에 남는 물감 얼룩
  var floaters = [];
  var dots = [];
  var keys = { left: false, right: false };
  var pointer = { drag: false, x: 0 };

  function readBest() {
    try {
      var v = parseInt(window.localStorage.getItem(KEY), 10);
      return isNaN(v) ? 0 : v;
    } catch (e) { return 0; }
  }
  function writeBest(v) {
    try { window.localStorage.setItem(KEY, String(v)); } catch (e) {}
  }
  state.best = readBest();

  /* ---------- Helpers ---------- */
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  function initDots() {
    dots = [];
    for (var i = 0; i < 42; i++) {
      dots.push({
        x: Math.random(),
        y: Math.random(),
        r: rand(0.6, 2.2),
        s: rand(0.006, 0.025),
        a: rand(0.05, 0.15)
      });
    }
  }
  initDots();

  function resize() {
    var rect = canvas.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(280, Math.round(rect.width));
    H = Math.max(320, Math.round(rect.height));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    player.y = H - 78;
    if (!inited) { player.x = W / 2; inited = true; }
    player.x = clamp(player.x, player.r + 8, W - player.r - 8);
  }

  /* ---------- HUD ---------- */
  function updateHud() {
    elScore.textContent = state.score;
    elBest.textContent = state.best;
    elCombo.textContent = state.combo > 1 ? state.combo + 'x' : state.combo;
    var s = '';
    for (var i = 0; i < 3; i++) s += (i < state.lives ? '●' : '○');
    elLives.textContent = s;
  }

  /* ---------- Overlay Screens ---------- */
  function showOverlay(html) {
    overlay.innerHTML = html;
    overlay.classList.add('show');
  }
  function hideOverlay() {
    overlay.classList.remove('show');
    overlay.innerHTML = '';
  }

  function screenStart() {
    showOverlay(
      '<div class="card">' +
        '<p class="eyebrow">Gallery 2026 · Mini Game</p>' +
        '<h2>아트 비행</h2>' +
        '<p class="desc">떨어지는 물감과 액자를 맞춰 캔버스를 채우세요.<br>연속 명중 시 콤보 점수와 특수 아이템이 등장합니다.</p>' +
        '<ul class="keys">' +
          '<li><b>← → / A D</b> 또는 <b>화면 드래그</b>로 이동</li>' +
          '<li><b>물감 놓침</b> 콤보 초기화 · <b>액자 파괴</b> 아이템 드롭</li>' +
          '<li><b>P / ESC</b> 일시정지</li>' +
        '</ul>' +
        '<button class="btn" data-act="start">전시 입장 (게임 시작)</button>' +
        '<a class="ghost" href="../">← 갤러리로 돌아가기</a>' +
      '</div>'
    );
  }

  function screenPause() {
    showOverlay(
      '<div class="card">' +
        '<p class="eyebrow">Paused</p>' +
        '<h2>잠시 멈춤</h2>' +
        '<p class="desc">작품을 감상하며 잠시 숨을 고르세요.</p>' +
        '<button class="btn" data-act="resume">계속하기</button>' +
        '<a class="ghost" href="../">← 갤러리로</a>' +
      '</div>'
    );
  }

  function screenGameOver() {
    showOverlay(
      '<div class="card">' +
        '<p class="eyebrow">Exhibition Fin</p>' +
        '<h2>작품 완성</h2>' +
        '<div class="scoreline">' +
          '<div><span class="k">Score</span><span class="v">' + state.score + '</span></div>' +
          '<div><span class="k">Max Combo</span><span class="v">' + state.maxCombo + '</span></div>' +
          '<div><span class="k">Best</span><span class="v">' + state.best + '</span></div>' +
        '</div>' +
        '<button class="btn" data-act="start">새 캔버스 시작</button>' +
        '<a class="ghost" href="../">← 갤러리로 돌아가기</a>' +
      '</div>'
    );
  }

  /* ---------- Game Flow ---------- */
  function resetGame() {
    state.score = 0;
    state.lives = 3;
    state.combo = 0;
    state.maxCombo = 0;
    state.spawnTimer = 650;
    state.fireTimer = 0;
    state.invuln = 0;
    state.shake = 0;
    state.elapsed = 0;
    state.tripleTimer = 0;

    bullets.length = 0;
    enemies.length = 0;
    items.length = 0;
    particles.length = 0;
    splatters.length = 0;
    floaters.length = 0;

    player.x = W / 2;
    player.vx = 0;
    player.shield = false;
    player.trail.length = 0;
    pointer.x = player.x;
    pointer.drag = false;
    updateHud();
  }

  function startGame() {
    initAudio();
    resetGame();
    state.mode = 'playing';
    hideOverlay();
  }

  function togglePause() {
    if (state.mode === 'playing') {
      state.mode = 'paused';
      screenPause();
    } else if (state.mode === 'paused') {
      state.mode = 'playing';
      hideOverlay();
    }
  }

  function gameOver() {
    state.mode = 'gameover';
    pointer.drag = false;
    if (state.score > state.best) {
      state.best = state.score;
      writeBest(state.best);
    }
    updateHud();
    screenGameOver();
  }

  /* ---------- Spawning & Effects ---------- */
  function addSplatter(x, y, color, radius) {
    if (splatters.length > 85) splatters.shift();
    var blobs = [];
    var count = 3 + ((Math.random() * 4) | 0);
    for (var i = 0; i < count; i++) {
      var ang = rand(0, Math.PI * 2);
      var dist = rand(0, radius * 0.75);
      blobs.push({
        dx: Math.cos(ang) * dist,
        dy: Math.sin(ang) * dist,
        r: radius * rand(0.35, 0.95)
      });
    }
    splatters.push({
      x: x, y: y,
      color: color,
      blobs: blobs,
      alpha: 0.13
    });
  }

  function spawnItem(x, y) {
    var types = ['triple', 'shield', 'heal'];
    var weights = [0.45, 0.35, 0.20];
    if (state.lives >= 3) weights = [0.55, 0.45, 0]; // 풀피일 땐 회복 제외

    var r = Math.random();
    var chosen = 'triple';
    if (r < weights[0]) chosen = 'triple';
    else if (r < weights[0] + weights[1]) chosen = 'shield';
    else chosen = 'heal';

    items.push({
      x: x, y: y,
      vy: 0.11,
      r: 12,
      type: chosen,
      phase: rand(0, Math.PI * 2)
    });
  }

  function spawnEnemy() {
    var diff = Math.min(state.score / 800, 1);
    var r = rand(13, 24);
    var type = 'blob', hp = 1, pts = 10;
    var color = PALETTE[(Math.random() * PALETTE.length) | 0];
    var roll = Math.random();

    if (roll > 0.91 && state.score > 100) {
      type = 'gold'; hp = 1; pts = 60; color = GOLD; r = 13;
    } else if (roll > 0.65 && state.score > 50) {
      type = 'frame'; hp = 2; pts = 30; color = INK; r = rand(16, 22);
    }

    var margin = r + 12;
    var baseX = rand(margin, Math.max(margin + 1, W - margin));

    enemies.push({
      type: type,
      x: baseX, y: -r - 12, r: r,
      hp: hp, maxhp: hp, pts: pts, color: color,
      vy: rand(0.085, 0.145) + diff * 0.085,
      baseX: baseX,
      amp: rand(10, 48),
      phase: rand(0, Math.PI * 2),
      spd: rand(0.0007, 0.0019),
      rot: rand(0, Math.PI * 2),
      spin: rand(-0.0016, 0.0016),
      flash: 0
    });
  }

  function makeBullet(x, y, vx) {
    return { x: x, y: y, vx: vx, vy: -0.95, r: 3 };
  }

  function shoot() {
    sfx.shoot();
    if (state.tripleTimer > 0) {
      bullets.push(makeBullet(player.x, player.y - 16, 0));
      bullets.push(makeBullet(player.x - 8, player.y - 11, -0.11));
      bullets.push(makeBullet(player.x + 8, player.y - 11, 0.11));
    } else if (state.score >= 300) {
      bullets.push(makeBullet(player.x - 7, player.y - 12, -0.05));
      bullets.push(makeBullet(player.x + 7, player.y - 12, 0.05));
    } else {
      bullets.push(makeBullet(player.x, player.y - 16, 0));
    }
  }

  function burst(x, y, color, n, power) {
    for (var i = 0; i < n; i++) {
      var a = rand(0, Math.PI * 2);
      var sp = rand(0.04, 0.24) * (power || 1);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        r: rand(1.3, 3.8),
        life: 0, max: rand(320, 620),
        color: color
      });
    }
  }

  function addFloater(x, y, text, color) {
    floaters.push({ x: x, y: y, text: text, color: color, life: 0, max: 750 });
  }

  function damagePlayer() {
    if (state.invuln > 0 || state.mode !== 'playing') return;

    if (player.shield) {
      player.shield = false;
      state.invuln = 900;
      state.shake = 220;
      sfx.shieldBreak();
      burst(player.x, player.y, SAGE, 16, 1.2);
      addFloater(player.x, player.y - 20, 'SHIELD BLOCK', SAGE);
      return;
    }

    state.lives--;
    state.combo = 0;
    state.invuln = 1500;
    state.shake = 420;
    sfx.damage();
    burst(player.x, player.y, TERRA, 20, 1.4);
    updateHud();
    if (state.lives <= 0) gameOver();
  }

  /* ---------- Update ---------- */
  function update(dt) {
    state.elapsed += dt;
    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt);
    if (state.tripleTimer > 0) state.tripleTimer = Math.max(0, state.tripleTimer - dt);

    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      d.y += (d.s * dt) / H;
      if (d.y > 1.05) { d.y = -0.05; d.x = Math.random(); }
    }

    if (state.mode !== 'playing') {
      player.vx *= 0.88;
      return;
    }

    if (state.invuln > 0) state.invuln = Math.max(0, state.invuln - dt);

    /* Player movement */
    var dir = 0;
    if (keys.left) dir -= 1;
    if (keys.right) dir += 1;

    if (dir !== 0) {
      player.vx = dir * 0.58;
      player.x += player.vx * dt;
      pointer.x = player.x;
    } else if (pointer.drag) {
      var dx = pointer.x - player.x;
      player.x += dx * Math.min(1, dt * 0.024);
      player.vx = clamp(dx * 0.02, -0.72, 0.72);
    } else {
      player.x += player.vx * dt;
      player.vx *= 0.82;
    }
    player.x = clamp(player.x, player.r + 8, W - player.r - 8);

    /* Trail record */
    player.trail.push({ x: player.x, y: player.y + 10 });
    if (player.trail.length > 14) player.trail.shift();

    /* Auto fire */
    state.fireTimer -= dt;
    if (state.fireTimer <= 0) {
      shoot();
      state.fireTimer = 185 - Math.min(55, state.score * 0.045);
    }

    /* Spawn */
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      spawnEnemy();
      var base = 860 - Math.min(500, state.score * 0.36);
      state.spawnTimer = base * rand(0.72, 1.15);
    }

    /* Bullets */
    for (var b = bullets.length - 1; b >= 0; b--) {
      var bl = bullets[b];
      bl.x += bl.vx * dt;
      bl.y += bl.vy * dt;
      if (bl.y < -24 || bl.x < -24 || bl.x > W + 24) bullets.splice(b, 1);
    }

    /* Items */
    for (var it = items.length - 1; it >= 0; it--) {
      var item = items[it];
      item.y += item.vy * dt;
      item.x += Math.sin(state.elapsed * 0.004 + item.phase) * 0.04 * dt;

      var ix = item.x - player.x;
      var iy = item.y - player.y;
      if (ix * ix + iy * iy < (item.r + player.r + 4) * (item.r + player.r + 4)) {
        sfx.powerup();
        if (item.type === 'triple') {
          state.tripleTimer = 7500;
          addFloater(item.x, item.y, 'TRIPLE SHOT!', TERRA);
        } else if (item.type === 'shield') {
          player.shield = true;
          addFloater(item.x, item.y, 'SHIELD ON', SAGE);
        } else if (item.type === 'heal') {
          state.lives = Math.min(3, state.lives + 1);
          addFloater(item.x, item.y, 'LIFE +1', TERRA);
          updateHud();
        }
        burst(item.x, item.y, GOLD, 14, 1);
        items.splice(it, 1);
        continue;
      }
      if (item.y - item.r > H + 20) items.splice(it, 1);
    }

    /* Enemies */
    for (var e = enemies.length - 1; e >= 0; e--) {
      var en = enemies[e];
      en.y += en.vy * dt;
      en.x = clamp(en.baseX + Math.sin(state.elapsed * en.spd + en.phase) * en.amp, en.r, W - en.r);
      en.rot += en.spin * dt;
      if (en.flash > 0) en.flash -= dt;

      if (en.y - en.r > H + 20) {
        if (state.combo > 0) {
          state.combo = 0;
          updateHud();
        }
        enemies.splice(e, 1);
      }
    }

    /* Bullet hits */
    for (var bi = bullets.length - 1; bi >= 0; bi--) {
      var bullet = bullets[bi];
      var hit = false;
      for (var ei = enemies.length - 1; ei >= 0; ei--) {
        var tgt = enemies[ei];
        var ddx = bullet.x - tgt.x;
        var ddy = bullet.y - tgt.y;
        if (ddx * ddx + ddy * ddy < (tgt.r + bullet.r) * (tgt.r + bullet.r)) {
          tgt.hp--;
          tgt.flash = 120;
          hit = true;
          burst(bullet.x, bullet.y, tgt.color, 4, 0.7);

          if (tgt.hp <= 0) {
            state.combo++;
            if (state.combo > state.maxCombo) state.maxCombo = state.combo;

            var bonus = Math.floor(tgt.pts * Math.min(1, (state.combo - 1) * 0.1));
            var totalPts = tgt.pts + bonus;
            state.score += totalPts;

            sfx.pop(state.combo);
            addSplatter(tgt.x, tgt.y, tgt.color, tgt.r * 1.15);

            var label = '+' + totalPts + (state.combo >= 3 ? ' (' + state.combo + ' COMBO)' : '');
            addFloater(tgt.x, tgt.y, label, tgt.color);
            burst(tgt.x, tgt.y, tgt.color, tgt.type === 'gold' ? 22 : 12, 1);

            if (tgt.type === 'gold') {
              state.shake = Math.max(state.shake, 160);
              spawnItem(tgt.x, tgt.y);
            } else if (tgt.type === 'frame' && Math.random() < 0.35) {
              spawnItem(tgt.x, tgt.y);
            }

            enemies.splice(ei, 1);
            updateHud();
          } else {
            sfx.hit();
          }
          break;
        }
      }
      if (hit) bullets.splice(bi, 1);
    }

    /* Player collision */
    for (var ci = enemies.length - 1; ci >= 0; ci--) {
      var ce = enemies[ci];
      var px = ce.x - player.x;
      var py = ce.y - player.y;
      var rr = ce.r + player.r * 0.78;
      if (px * px + py * py < rr * rr) {
        burst(ce.x, ce.y, ce.color, 14, 1.1);
        addSplatter(ce.x, ce.y, ce.color, ce.r);
        enemies.splice(ci, 1);
        damagePlayer();
        break;
      }
    }

    /* Particles */
    for (var pi = particles.length - 1; pi >= 0; pi--) {
      var p = particles[pi];
      p.life += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.vy += 0.00012 * dt;
      if (p.life >= p.max) particles.splice(pi, 1);
    }

    /* Floaters */
    for (var fi = floaters.length - 1; fi >= 0; fi--) {
      var f = floaters[fi];
      f.life += dt;
      f.y -= 0.03 * dt;
      if (f.life >= f.max) floaters.splice(fi, 1);
    }
  }

  /* ---------- Draw ---------- */
  function drawBackground() {
    ctx.fillStyle = '#fffdf8';
    ctx.fillRect(0, 0, W, H);

    /* Canvas Paint Splatters */
    for (var s = 0; s < splatters.length; s++) {
      var sp = splatters[s];
      ctx.save();
      ctx.globalAlpha = sp.alpha;
      ctx.fillStyle = sp.color;
      for (var b = 0; b < sp.blobs.length; b++) {
        var bl = sp.blobs[b];
        ctx.beginPath();
        ctx.arc(sp.x + bl.dx, sp.y + bl.dy, bl.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    /* Gallery wall: faint grid */
    ctx.strokeStyle = 'rgba(28,27,25,0.035)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    var gap = 46;
    for (var x = gap; x < W; x += gap) {
      ctx.moveTo(Math.round(x) + 0.5, 0);
      ctx.lineTo(Math.round(x) + 0.5, H);
    }
    for (var y = gap; y < H; y += gap) {
      ctx.moveTo(0, Math.round(y) + 0.5);
      ctx.lineTo(W, Math.round(y) + 0.5);
    }
    ctx.stroke();

    /* Spotlight */
    var g = ctx.createRadialGradient(W / 2, H * 0.12, 10, W / 2, H * 0.12, Math.max(W, H) * 0.95);
    g.addColorStop(0, 'rgba(255,255,255,0.75)');
    g.addColorStop(0.55, 'rgba(247,243,236,0.12)');
    g.addColorStop(1, 'rgba(28,27,25,0.05)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    /* Drifting dust */
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      ctx.beginPath();
      ctx.arc(d.x * W, d.y * H, d.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(28,27,25,' + d.a + ')';
      ctx.fill();
    }
  }

  function drawPlayer() {
    if (state.lives <= 0) return;

    /* Pencil Trail */
    if (player.trail.length > 1) {
      ctx.save();
      for (var t = 1; t < player.trail.length; t++) {
        var p0 = player.trail[t - 1];
        var p1 = player.trail[t];
        var ratio = t / player.trail.length;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y + (player.trail.length - t) * 1.4);
        ctx.lineTo(p1.x, p1.y + (player.trail.length - t - 1) * 1.4);
        ctx.strokeStyle = 'rgba(28,27,25,' + (ratio * 0.16) + ')';
        ctx.lineWidth = ratio * 1.5;
        ctx.stroke();
      }
      ctx.restore();
    }

    var blink = state.invuln > 0 && Math.floor(state.invuln / 110) % 2 === 0;
    ctx.save();
    ctx.globalAlpha = blink ? 0.3 : 1;
    ctx.translate(player.x, player.y);

    /* Shield Ring */
    if (player.shield) {
      ctx.beginPath();
      ctx.arc(0, 0, 23, 0, Math.PI * 2);
      ctx.strokeStyle = SAGE;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 3]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.rotate(clamp(player.vx * 0.42, -0.28, 0.28));

    /* Soft glow */
    var gl = ctx.createRadialGradient(0, 0, 2, 0, 0, 30);
    gl.addColorStop(0, 'rgba(192,106,69,0.18)');
    gl.addColorStop(1, 'rgba(192,106,69,0)');
    ctx.fillStyle = gl;
    ctx.beginPath();
    ctx.arc(0, 0, 30, 0, Math.PI * 2);
    ctx.fill();

    /* Paper plane */
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(14, 11);
    ctx.lineTo(0, 5);
    ctx.lineTo(-14, 11);
    ctx.closePath();
    ctx.fillStyle = INK;
    ctx.fill();

    /* Accent fold */
    ctx.beginPath();
    ctx.moveTo(0, -14);
    ctx.lineTo(5, 4);
    ctx.lineTo(-5, 4);
    ctx.closePath();
    ctx.fillStyle = state.tripleTimer > 0 ? GOLD : TERRA;
    ctx.fill();

    ctx.restore();
  }

  function drawItems() {
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      ctx.save();
      ctx.translate(it.x, it.y);

      ctx.beginPath();
      ctx.arc(0, 0, it.r, 0, Math.PI * 2);
      ctx.fillStyle = '#fffdf8';
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = it.type === 'shield' ? SAGE : (it.type === 'triple' ? GOLD : TERRA);
      ctx.stroke();

      ctx.fillStyle = ctx.strokeStyle;
      ctx.font = '700 10px "Helvetica Neue", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      var icon = it.type === 'shield' ? 'S' : (it.type === 'triple' ? 'III' : '♥');
      ctx.fillText(icon, 0, 0.5);

      ctx.restore();
    }
  }

  function drawEnemies() {
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      ctx.save();
      ctx.translate(e.x, e.y);

      if (e.type === 'frame') {
        ctx.rotate(e.rot);
        ctx.beginPath();
        var s = e.r * 0.92;
        ctx.rect(-s, -s, s * 2, s * 2);
        ctx.lineWidth = 3;
        ctx.strokeStyle = e.color;
        ctx.stroke();
        ctx.beginPath();
        ctx.rect(-s * 0.6, -s * 0.6, s * 1.2, s * 1.2);
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(28,27,25,0.28)';
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, e.r * 0.2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(28,27,25,0.5)';
        ctx.fill();
      } else if (e.type === 'gold') {
        ctx.rotate(e.rot);
        ctx.beginPath();
        for (var k = 0; k < 8; k++) {
          var ang = (Math.PI * 2 * k) / 8;
          var rr = k % 2 === 0 ? e.r * 1.25 : e.r * 0.5;
          var xx = Math.cos(ang) * rr;
          var yy = Math.sin(ang) * rr;
          if (k === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
        }
        ctx.closePath();
        ctx.fillStyle = e.color;
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, e.r, 0, Math.PI * 2);
        ctx.fillStyle = e.color;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(-e.r * 0.3, -e.r * 0.32, e.r * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.fill();
      }

      if (e.flash > 0) {
        ctx.globalAlpha = (e.flash / 120) * 0.85;
        ctx.beginPath();
        ctx.arc(0, 0, e.r + 2, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      if (e.maxhp > 1 && e.hp === 1) {
        ctx.beginPath();
        ctx.arc(0, 0, e.r + 4, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(192,106,69,0.55)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      ctx.restore();
    }
  }

  function drawBullets() {
    for (var i = 0; i < bullets.length; i++) {
      var b = bullets[i];
      ctx.beginPath();
      ctx.moveTo(b.x, b.y - 7);
      ctx.lineTo(b.x, b.y + 5);
      ctx.strokeStyle = INK;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(b.x, b.y - 8, 1.6, 0, Math.PI * 2);
      ctx.fillStyle = state.tripleTimer > 0 ? GOLD : TERRA;
      ctx.fill();
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var t = 1 - p.life / p.max;
      ctx.globalAlpha = Math.max(0, t) * 0.9;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.4 + t * 0.8), 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawFloaters() {
    ctx.textAlign = 'center';
    ctx.font = '600 11.5px "Helvetica Neue", Helvetica, Arial, sans-serif';
    for (var i = 0; i < floaters.length; i++) {
      var f = floaters[i];
      var t = 1 - f.life / f.max;
      ctx.globalAlpha = Math.max(0, t);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'start';
  }

  function drawVignette() {
    var g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.78);
    g.addColorStop(0, 'rgba(28,27,25,0)');
    g.addColorStop(1, 'rgba(28,27,25,0.11)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function draw() {
    ctx.save();
    if (state.shake > 0) {
      var t = state.shake / 420;
      ctx.translate((Math.random() - 0.5) * 11 * t, (Math.random() - 0.5) * 11 * t);
    }
    drawBackground();
    drawItems();
    drawEnemies();
    drawBullets();
    drawParticles();
    if (state.mode !== 'gameover') drawPlayer();
    drawFloaters();
    ctx.restore();
    drawVignette();
  }

  /* ---------- Loop ---------- */
  var last = 0;
  function frame(ts) {
    if (!last) last = ts;
    var dt = Math.min(ts - last, 42);
    last = ts;
    update(dt);
    draw();
    window.requestAnimationFrame(frame);
  }

  /* ---------- Input ---------- */
  function isLeft(k) { return k === 'ArrowLeft' || k === 'a' || k === 'A'; }
  function isRight(k) { return k === 'ArrowRight' || k === 'd' || k === 'D'; }

  window.addEventListener('keydown', function (e) {
    if (isLeft(e.key)) { keys.left = true; e.preventDefault(); }
    else if (isRight(e.key)) { keys.right = true; e.preventDefault(); }
    else if (e.key === ' ' || e.key === 'Enter') {
      if (state.mode === 'ready' || state.mode === 'gameover') { startGame(); e.preventDefault(); }
      else if (state.mode === 'paused') { togglePause(); e.preventDefault(); }
    } else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      togglePause();
    }
  });

  window.addEventListener('keyup', function (e) {
    if (isLeft(e.key)) keys.left = false;
    if (isRight(e.key)) keys.right = false;
  });

  function pointerX(e) {
    var rect = canvas.getBoundingClientRect();
    return e.clientX - rect.left;
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (state.mode !== 'playing') return;
    initAudio();
    pointer.drag = true;
    pointer.x = pointerX(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!pointer.drag) return;
    pointer.x = pointerX(e);
    e.preventDefault();
  });

  function endDrag() { pointer.drag = false; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  overlay.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    if (act === 'start') startGame();
    else if (act === 'resume') togglePause();
  });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state.mode === 'playing') {
      state.mode = 'paused';
      pointer.drag = false;
      keys.left = keys.right = false;
      screenPause();
    }
  });

  /* ---------- Boot ---------- */
  resize();
  updateHud();
  screenStart();
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
